function Login({t,onOk}){

function Ring({value,max,size,stroke,color,children}){size=size||88;stroke=stroke||7;const r=(size-stroke)/2,c=2*Math.PI*r,o=c-Math.min(1,(value||0)/max)*c;return h("div",{style:{position:"relative",width:size,height:size,flex:"0 0 auto"}},h("svg",{width:size,height:size,style:{transform:"rotate(-90deg)"}},h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"currentColor",opacity:0.1,strokeWidth:stroke}),h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:stroke,strokeDasharray:c,strokeDashoffset:o,strokeLinecap:"round",style:{transition:"stroke-dashoffset 0.8s"}})),h("div",{style:{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},children));}

function decodePolyline(s){const p=[];let i=0,la=0,ln=0;while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);la+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);ln+=(r&1)?~(r>>1):(r>>1);p.push([la/1e5,ln/1e5])}return p}

// ─── Markdown ligero (negritas, listas, código) para el entrenador ───
function mdInline(s,t){
  const out=[];let rest=s,k=0;
  const re=/(\*\*[^*]+\*\*|`[^`]+`)/;
  while(rest.length){
    const m=rest.match(re);
    if(!m){out.push(rest);break}
    if(m.index>0)out.push(rest.slice(0,m.index));
    const tok=m[0];
    if(tok.startsWith("**"))out.push(h("strong",{key:k++},tok.slice(2,-2)));
    else out.push(h("code",{key:k++,style:{background:t.ph,borderRadius:4,padding:"1px 5px",fontSize:"0.9em"}},tok.slice(1,-1)));
    rest=rest.slice(m.index+tok.length);
  }
  return out;
}
function Md({text,t}){
  const lines=(text||"").split("\n");const blocks=[];let list=null;
  const flush=()=>{if(list){blocks.push(h("ul",{key:"l"+blocks.length,style:{margin:"4px 0 8px",paddingLeft:18,display:"flex",flexDirection:"column",gap:4}},list));list=null}};
  lines.forEach((ln,i)=>{
    const s=ln.trim();
    if(!s){flush();return}
    const bullet=s.match(/^[-*•]\s+(.*)$/)||s.match(/^(\d+)[.)]\s+(.*)$/);
    if(bullet){const txt=bullet.length===3?bullet[2]:bullet[1];if(!list)list=[];list.push(h("li",{key:i,style:{lineHeight:1.5}},mdInline(txt,t)));return}
    flush();
    const head=s.match(/^#{1,4}\s+(.*)$/);
    if(head){blocks.push(h("div",{key:i,style:{fontWeight:700,margin:"8px 0 2px"}},mdInline(head[1],t)));return}
    blocks.push(h("p",{key:i,style:{margin:"0 0 8px",lineHeight:1.55}},mdInline(s,t)));
  });
  flush();
  return h("div",null,blocks);
}

  const[full,setFull]=useState(null);
  const[loading,setLoading]=useState(true);
  const[metric,setMetric]=useState("hr");
  useEffect(()=>{let alive=true;setLoading(true);setFull(null);
    api("activity?id="+a.id+"&full=1").then(j=>{if(alive){setFull(j&&!j.error?j:null);setLoading(false)}}).catch(()=>{if(alive)setLoading(false)});
    return()=>{alive=false}},[a.id]);

  // Mapa desde la polyline
  const pts=a.polyline?decodePolyline(a.polyline):[];let svgC=null;
  if(pts.length>1){const las=pts.map(p=>p[0]),lns=pts.map(p=>p[1]);const mla=Math.min(...las),xla=Math.max(...las),mln=Math.min(...lns),xln=Math.max(...lns);const w=xln-mln||.001,ht=xla-mla||.001,sc=Math.min(260/w,150/ht);const mp=pts.map(p=>[(p[1]-mln)*sc+20,(xla-p[0])*sc+15]);const d=mp.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");const vw=w*sc+40,vh=ht*sc+30;

  const stats=[{l:"Distancia",v:a.distance+" km"},{l:"Tiempo",v:a.time},{l:"Desnivel",v:"↑"+a.elevation+"m"}];

  const pts2=(full&&full.streams&&full.streams.points)||[];

  const metrics=[];
  if(has("hr"))metrics.push({id:"hr",l:"FC",c:A.hr,u:" bpm"});
  if(has("pace_sec")&&a.sport!=="Ride")metrics.push({id:"pace_sec",l:"Ritmo",c:color,u:"/km"});
  if(has("speed")&&a.sport==="Ride")metrics.push({id:"speed",l:"Velocidad",c:color,u:" km/h"});
  if(has("alt"))metrics.push({id:"alt",l:"Altitud",c:A.hike,u:" m"});
  if(has("watts"))metrics.push({id:"watts",l:"Potencia",c:A.fit,u:" W"});
  if(has("cad"))metrics.push({id:"cad",l:"Cadencia",c:A.stress,u:" rpm"});
  const cur=metrics.find(m=>m.id===metric)||metrics[0];
  const chartData=cur?pts2.filter(p=>p[cur.id]!=null).map(p=>({x:p.km>0?p.km:p.t/60,v:p[cur.id],t:p.t_label})):[];
  const isPace=cur&&cur.id==="pace_sec";

  const laps=(full&&full.laps)||[];
  const maxLapPace=laps.length?Math.max(...laps.map(l=>paceToSec(l.pace))):0;
  const minLapPace=laps.length?Math.min(...laps.map(l=>paceToSec(l.pace))):0;
  const zones=((full&&full.zones)||[]).filter(z=>z.buckets&&z.buckets.length);

  return h("div",{onClick:onClose,style:{position:"fixed",inset:0,zIndex:100,background:"rgba(0,0,0,0.5)",display:"flex",justifyContent:"center",alignItems:"flex-end",backdropFilter:"blur(4px)"}},
    h("div",{onClick:e=>e.stopPropagation(),style:{width:"100%",maxWidth:560,maxHeight:"92vh",background:t.bg,borderRadius:"20px 20px 0 0",overflow:"auto"}},

        h("div",{style:{display:"flex",justifyContent:"space-between"}},
          h("div",{style:{display:"flex",gap:12,alignItems:"center",minWidth:0}},
            h(SportIcon,{sport:a.sport,s:40,c:"rgba(255,255,255,0.2)"}),
            h("div",{style:{minWidth:0}},h("div",{style:{fontSize:18,fontWeight:600}},a.name),
              h("div",{style:{fontSize:12,opacity:0.85}},(a.date_formatted||a.date)+(a.start_time?" · "+a.start_time:"")+" · "+a.sport))),
          h("button",{onClick:onClose,"aria-label":"Cerrar",style:{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:"50%",width:40,height:40,flex:"0 0 auto",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},h(Ic,{n:"close",s:18,w:2.2}))),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:"12px 8px",marginTop:14}},stats.map((s,i)=>h("div",{key:i},h("div",{style:{fontSize:17,fontWeight:600}},s.v),h("div",{style:{fontSize:12,opacity:0.85}},s.l))))),
