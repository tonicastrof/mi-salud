name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL del despliegue que abrirá la app"
        required: false
        default: "https://mi-salud-nine.vercel.app"
  push:
    branches:
      - master
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

env:
  DEFAULT_APP_URL: "https://mi-salud-nine.vercel.app"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # La misma clave en todas las compilaciones: así el móvil deja
      # actualizar la app encima de la anterior sin desinstalarla.
      - name: Reutilizar la clave de firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1

      - name: Crear la clave si no existe
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Mi Salud, O=Mi Salud, C=ES"
          fi

      - name: Compilar la APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappUrl="${{ inputs.app_url || env.DEFAULT_APP_URL }}" \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk mi-salud-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-salud-apk
          path: mi-salud-*.apk

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ inputs.app_url || env.DEFAULT_APP_URL }}
        run: |
          gh release create "apk-v1.0.${{ github.run_number }}" mi-salud-1.0.${{ github.run_number }}.apk \
            --target "${{ github.sha }}" \
            --title "Mi Salud APK 1.0.${{ github.run_number }}" \
            --notes "APK de Mi Salud apuntando a ${APP_URL}.

          Para instalarla: abre este enlace desde el móvil, descarga el \`.apk\` y acepta instalar desde orígenes desconocidos."
