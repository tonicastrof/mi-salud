name: Sondeo carreirasgalegas (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-carreiras.yml"]
concurrency:
  group: probe-carreiras
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rutas de la API
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          B=https://www.carreirasgalegas.com
          curl -sSL -A "$UA" $B/main.b2bac07fc93cf91b.js -o main.js
          curl -sSL -A "$UA" $B/runtime.cd7b82f05d3877af.js -o runtime.js
          python3 - <<'PY'
          import re,subprocess
          s=open('main.js',encoding='utf-8',errors='replace').read()
          for u in ['https://api.web.carreirasgalegas.com','https://search.carreirasgalegas.com','https://api.tp.carreirasgalegas.com','https://races.blob.core.windows.net']:
              for m in list(re.finditer(re.escape(u),s))[:3]:
                  print('CTX',u,'::',s[max(0,m.start()-300):m.start()+200])
          # claves del objeto environment
          keys=set(re.findall(r'([A-Za-z_$][\w$]*):"https://(?:api\.web|search|api\.tp|ranking\.api)\.carreirasgalegas\.com',s))
          print('KEYS',keys)
          for k in keys:
              hits=[m.start() for m in re.finditer(r'\.'+re.escape(k)+r'\b',s)]
              print('==',k,len(hits))
              for h in hits[:60]:
                  print('  ',s[h-40:h+160].replace('\n',' '))
          r=open('runtime.js',encoding='utf-8',errors='replace').read()
          print('RUNTIME',r[:3000])
          PY
