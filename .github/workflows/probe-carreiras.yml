name: Sondeo carreirasgalegas (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-carreiras.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Buscar la API en main.js
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          curl -sSL -A "$UA" https://www.carreirasgalegas.com/main.b2bac07fc93cf91b.js -o main.js
          ls -la main.js
          echo "--- URLs"
          grep -oE 'https?://[a-zA-Z0-9._/-]+' main.js | sort | uniq -c | sort -rn | head -60
          echo "--- rutas con event/race/carreira/api"
          grep -oE '"[a-zA-Z0-9_/{}.$-]*(event|Event|race|carreir|api|calendar)[a-zA-Z0-9_/{}.$?=&-]*"' main.js | sort -u | head -150
          echo "--- contexto de apiUrl/baseUrl/environment"
          grep -oE '.{0,200}(apiUrl|baseUrl|API_URL|urlApi|apiBase|environment)[^;]{0,250}' main.js | head -30
          echo "--- contexto 'events'"
          grep -oE '.{0,160}/events[^;]{0,200}' main.js | head -30
