name: Sondeo carreirasgalegas (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-carreiras.yml"]
concurrency:
  group: probe-carreiras
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Buscar la API en main.js
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          curl -sSL -A "$UA" https://www.carreirasgalegas.com/main.b2bac07fc93cf91b.js -o main.js
          ls -la main.js
          python3 - <<'PY'
          import re
          s=open('main.js',encoding='utf-8',errors='replace').read()
          urls=sorted(set(re.findall(r'https?://[A-Za-z0-9._/-]+',s)))
          print("--- URLs"); [print(u) for u in urls[:80]]
          print("--- strings con api/event")
          strs=sorted(set(m for m in re.findall(r'"([^"\n]{2,120})"',s) if re.search(r'api|event|Event|race|carreir|calendar|inscri',m)))
          for x in strs[:200]: print(repr(x))
          print("--- contexto")
          for kw in ['apiUrl','baseUrl','environment','/events','getEvents','urlApi']:
              for m in list(re.finditer(re.escape(kw),s))[:6]:
                  print(kw,'::',s[max(0,m.start()-200):m.start()+250].replace('\n',' '))
          PY
