name: Sondeo carreirasgalegas (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-carreiras.yml"]
concurrency:
  group: probe-carreiras
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: API pública sin credenciales
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          A=https://api.web.carreirasgalegas.com
          for p in "/competitions" "/competitions?first=0&rows=3" "/circuits"; do
            echo "--- GET $p"
            curl -sS -A "$UA" -H "Accept: application/json" -H "Origin: https://www.carreirasgalegas.com" -w "\nHTTP %{http_code}\n" "$A$p" | head -c 5000; echo
          done
