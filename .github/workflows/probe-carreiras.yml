name: Sondeo carreirasgalegas (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-carreiras.yml"]
concurrency:
  group: probe-carreiras
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rutas en los chunks y prueba
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          B=https://www.carreirasgalegas.com
          curl -sSL -A "$UA" $B/main.b2bac07fc93cf91b.js -o main.js
          for c in 86.c73a1343d2b32a07 105.878545028b252888 175.17c0413e1d72b17d 194.cd9e0febb669977e 231.860e5245dd8452a6 232.ace51125ea113737 277.f815e9b295b7b6d9 402.51fc5dff33c0f55e 466.82df258d1634c466 527.3f82005c0950152e 611.8dcfb65e2502cfc8 703.f32a32cb6f3d5c14 865.c75a5708f9ed8dc2 927.7c3d07697b236062 940.f6abec2c32c948d2; do
            curl -sSL -A "$UA" "$B/$c.js" -o "chunk-$c.js"; done
          python3 - <<'PY'
          import re,glob
          for f in ['main.js']+sorted(glob.glob('chunk-*.js')):
              s=open(f,encoding='utf-8',errors='replace').read()
              paths=sorted(set(re.findall(r'\$\{[\w$.]+\.api\}(/[^`"\']{0,80})',s)))
              ms=[s[m.start()-150:m.start()+250] for m in re.finditer(r'meilisearch|\.index\(|indexUid|multiSearch',s)][:4]
              ev=[s[m.start()-200:m.start()+300] for m in re.finditer(r'getEvents|EventsComponent|eventDate|startDate|province',s)][:3]
              if paths or ms or ev:
                  print('#####',f,len(s))
                  for p in paths: print('  PATH',p)
                  for x in ms: print('  MS ::',x.replace('\n',' '))
                  for x in ev: print('  EV ::',x.replace('\n',' '))
          PY
