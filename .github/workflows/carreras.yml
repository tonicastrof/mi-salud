name: Carreras

# Descarga el calendario de Carreiras Galegas y CCNorte y lo publica en la
# rama `datos` (carreras.json). La app lo lee de ahí en su sincronización
# diaria. También publica geo.json, la caché de coordenadas de cada localidad.
# Para descargarlo en el momento: pestaña Actions → Carreras → Run workflow.
on:
  schedule:
    - cron: "23 4 * * *"      # 06:23 en Galicia (horario de verano), antes del cron de la app
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/carreras/**"
      - ".github/workflows/carreras.yml"

permissions:
  contents: write

concurrency:
  group: carreras
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -q requests beautifulsoup4 selenium

      - name: Caché de coordenadas
        # La de la descarga anterior (rama datos), para no volver a preguntar a Nominatim
        run: |
          git fetch -q --depth=1 origin datos && git show origin/datos:geo.json > geo.json || echo "{}" > geo.json

      - name: Descargar las carreras
        run: python scripts/carreras/scrape.py carreras.json geo.json

      - name: Muestra
        run: |
          python - <<'PY'
          import json
          d = json.load(open("carreras.json", encoding="utf-8"))
          print(json.dumps(d["sources"], ensure_ascii=False))
          for src in ("carreirasgalegas", "ccnorte"):
              for it in [i for i in d["items"] if i["source"] == src][:3]:
                  print(json.dumps(it, ensure_ascii=False))
          PY

      - name: Publicar en la rama datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cp carreras.json geo.json pub/ && cd pub
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carreras.json geo.json
          git commit -qm "Carreras $(date -u +%F)"
          # Un solo commit cada vez: la rama no crece con el historial
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
